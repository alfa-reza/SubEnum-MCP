name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...
        env:
          GOTOOLCHAIN: local

      - name: Run go vet
        run: go vet ./...
        env:
          GOTOOLCHAIN: local

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: subenum
            archive: subenum-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            binary: subenum
            archive: subenum-linux-arm64.tar.gz
          - goos: darwin
            goarch: amd64
            binary: subenum
            archive: subenum-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            binary: subenum
            archive: subenum-darwin-arm64.tar.gz
          - goos: windows
            goarch: amd64
            binary: subenum.exe
            archive: subenum-windows-amd64.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build binary
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          BINARY_NAME: ${{ matrix.binary }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          version=0.1.0-dev.1
          if [[ "$RELEASE_REF_TYPE" == tag && "$RELEASE_REF" == v* ]]; then version="${RELEASE_REF#v}"; fi
          GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath -ldflags "-X main.serverVersion=$version" -o "dist/$BINARY_NAME" ./cmd/subenum

      - name: Package binary and checksum
        env:
          BINARY_NAME: ${{ matrix.binary }}
          ARCHIVE_NAME: ${{ matrix.archive }}
        run: |
          cd dist
          sha256sum "$BINARY_NAME" > SHA256SUMS
          cp ../THIRD_PARTY_NOTICES.md .
          cp ../LICENSE .
          if [[ "$ARCHIVE_NAME" == *.zip ]]; then
            zip -q "$ARCHIVE_NAME" "$BINARY_NAME" SHA256SUMS THIRD_PARTY_NOTICES.md LICENSE
          else
            tar -czf "$ARCHIVE_NAME" "$BINARY_NAME" SHA256SUMS THIRD_PARTY_NOTICES.md LICENSE
          fi
          test -s "$ARCHIVE_NAME"

      - name: Upload downloadable binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create archive checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Publish release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes "${options[@]}"
