name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...
        env:
          GOTOOLCHAIN: local

      - name: Run go vet
        run: go vet ./...
        env:
          GOTOOLCHAIN: local

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: subenum-mcp
            archive: subenum-mcp-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            binary: subenum-mcp
            archive: subenum-mcp-linux-arm64.tar.gz
          - goos: darwin
            goarch: amd64
            binary: subenum-mcp
            archive: subenum-mcp-darwin-amd64.tar.gz
          - goos: darwin
            goarch: arm64
            binary: subenum-mcp
            archive: subenum-mcp-darwin-arm64.tar.gz
          - goos: windows
            goarch: amd64
            binary: subenum-mcp.exe
            archive: subenum-mcp-windows-amd64.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build binary
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          BINARY_NAME: ${{ matrix.binary }}
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build -trimpath -o "dist/$BINARY_NAME" ./cmd/subenum-mcp

      - name: Package binary and checksum
        env:
          BINARY_NAME: ${{ matrix.binary }}
          ARCHIVE_NAME: ${{ matrix.archive }}
        run: |
          cd dist
          sha256sum "$BINARY_NAME" > SHA256SUMS
          cp ../THIRD_PARTY_NOTICES.md .
          if [[ "$ARCHIVE_NAME" == *.zip ]]; then
            zip -q "$ARCHIVE_NAME" "$BINARY_NAME" SHA256SUMS THIRD_PARTY_NOTICES.md
          else
            tar -czf "$ARCHIVE_NAME" "$BINARY_NAME" SHA256SUMS THIRD_PARTY_NOTICES.md
          fi
          test -s "$ARCHIVE_NAME"

      - name: Upload downloadable binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: dist/${{ matrix.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 14
